name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The default PyPI torch wheel pulls ~3 GB of CUDA libraries a CI
      # runner never uses; the CPU index has a ~200 MB build instead.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==$(sed -n 's/^torch==//p' requirements.txt)"
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # No model downloads and no LLM calls: the tests stub both.
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
            config -q
